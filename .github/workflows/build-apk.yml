name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build APK
        run: |
          mkdir build_app && cd build_app
          npx @bubblewrap/cli init --manifest="https://ahmedabdelstarr4-svg.github.io/2/manifest.json" || true
          
          # إعداد مشروع أندرويد سريع كـ WebView
          cd ..
          npm install -g cordova
          cordova create android_app com.financial.app FinancialApp
          cd android_app
          cp -r ../. www/
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
